lidar_location:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser

    map_topic: /map
    scan_topic: /scan
    initial_pose_topic: /initialpose
    pose_topic: /amcl_pose
    scan_cloud_topic: /lidar_location/scan_cloud

    tf_broadcast: true
    tf_publish_rate: 30.0
    transform_tolerance: 0.3
    tf_lookup_timeout: 0.2

    set_initial_pose: true
    reset_pose_on_map: false
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

    occupied_threshold: 65
    likelihood_field_radius: 1.25
    linear_search_step: 0.0
    angular_search_step_deg: 1.0
    refinement_levels: 3
    refinement_step_scale: 0.5
    max_iterations: 80
    max_translation_correction: 0.5
    max_rotation_correction_deg: 20.0
    max_beams: 180
    min_valid_beams: 20
    min_match_score: 0.05
    min_laser_range: 0.1
    max_laser_range: 5.0

    quality:
      lost_score: 0.20
      recovery_score: 0.45
      locked_score: 0.55
      lost_confirm_frames: 3
      recovery_confirm_frames: 5
      min_inlier_ratio: 0.45
      inlier_likelihood_threshold: 0.35
      trim_ratio: 0.25
      min_score_improvement: 0.02
      large_correction_translation: 0.10
      large_correction_rotation_deg: 5.0
      degraded_correction_gain: 0.20
      max_locked_translation_step: 0.15
      max_locked_rotation_step_deg: 5.0
      max_degraded_translation_step: 0.01
      max_degraded_rotation_step_deg: 0.3

    filter:
      isolated_point_enabled: true
      isolated_range_threshold: 0.10
      static_wall_enabled: true
      static_wall_max_distance: 0.25
      static_wall_min_points: 20

    deskew:
      enabled: true
      max_scan_time: 0.15

    coarse_search:
      enabled: true
      trigger_score: 0.45
      linear_range: 0.75
      angular_range_deg: 30.0
      linear_step: 0.10
      angular_step_deg: 3.0
      interval_frames: 3
      prior_translation_weight: 0.05
      prior_rotation_weight: 0.02

    covariance:
      x: 0.05
      y: 0.05
      yaw: 0.03

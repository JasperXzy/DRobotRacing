# 二维码后巡点和 waypoint_shift 点云航点平移的唯一参数入口。
visual_lidar_path_follower:
  ros__parameters:
    # 航点、坐标系与输出
    waypoints_file: /root/D_Robot/test/dev_ws/src/origincar_system/config/waypoints_qr.yaml  # 兼容模式下扫码前行驶的航点文件
    route_waypoints_clockwise_file: /root/D_Robot/test/dev_ws/src/origincar_system/config/waypoints_channel_clockwise.yaml  # 扫码后顺时针独立路线
    route_waypoints_counterclockwise_file: /root/D_Robot/test/dev_ws/src/origincar_system/config/waypoints_channel_counterclockwise.yaml  # 扫码后逆时针独立路线
    frame_id: map  # 航点所在的地图坐标系
    base_frame_id: base_link  # 车辆本体坐标系
    cmd_vel_topic: /cmd_vel  # 速度指令发布话题
    debug_control_logs: false  # 是否输出详细控制日志
    wait_for_qr_before_start: true  # 启动后是否停车等待二维码再开始巡点
    enable_debug_visualization: true  # 是否发布 Foxglove 中的 waypoints、圆锥圆心和拟合圆
    # 正向追点
    control_frequency: 50.0  # 控制循环频率，单位 Hz
    linear_speed: 1.05  # 正常巡点线速度，单位 m/s
    turn_angular_gain: 1.6  # 正向航向误差到下位机前轮目标转角的比例增益
    enable_turn_speed_slowdown: true  # 是否根据即将下发的目标前轮转角绝对值线性降低巡点速度
    turn_speed_full_steering_angle: 0.55  # 达到最大降速比例时的目标前轮转角绝对值，单位rad
    max_turn_speed_reduction_percent: 20.0  # 达到上述转角时的最大降速百分比，允许范围0～90
    lookahead_distance: 0.65  # 正常巡点目标的前瞻距离，单位 m
    pass_radius: 0.6  # 航点未单独配置时使用的默认通过半径，单位 m
    route_projection_max_distance: 0.6  # 允许车辆匹配当前路线段的最大横向距离，单位 m
    segment_advance_t: 0.6  # 车辆投影超过当前线段此比例时推进路线进度

    # 倒车追点；倒车时不更新 waypoint_shift
    reverse_angular_gain: 1.1  # 倒车航向误差到角速度的比例增益
    reverse_goal_lookahead_distance: 0.25  # 倒车目标允许的最大前瞻距离，单位 m
    reverse_pass_radius: 0.25  # 倒车航点未单独配置时的通过半径，单位 m

    # 雷达和地图输入
    scan_topic: /scan  # 雷达扫描数据话题
    map_topic: /map  # race_modify 定位地图；同时用于过滤真实固定墙体点云
    restriction_map_topic: /restriction_map  # 图2 race_keepout；用于过滤软禁行区域内的点云

    # waypoint_shift 点云簇与 Foxglove 圆锥圆显示
    cluster_max_point_gap: 0.06   # 同一点云簇相邻点允许的最大空间间距，单位 m
    cluster_max_range_jump: 0.10  # 同一点云簇相邻点允许的最大距离突变，单位 m
    cluster_min_points: 3         # 有效圆锥点云簇至少包含的雷达点数
    cone_circle_min_radius: 0.03  # 接受的圆锥截面拟合最小半径，单位 m；对应约7cm直径
    cone_circle_max_radius: 0.07  # 接受的圆锥截面拟合最大半径，单位 m；对应约13cm直径
    cone_circle_max_rmse: 0.015   # 接受圆拟合的最大径向均方根误差，单位 m
    waypoint_shift_occupied_threshold: 50   # race_keepout软禁行区的点云过滤占据阈值
    waypoint_shift_check_count: 100          # waypoint_shift模式每帧从当前追踪点开始检查的航点数量
    waypoint_cloud_check_radius: 0.5       # 点云距未来路线小于该距离才触发平移，单位 m；提前距离由check_count决定
    waypoint_shift_target_clearance: 0.40  # 偏移后的路线在选定横截方向越过点云最外沿的目标净距，单位 m
    waypoint_shift_enable_local_rebuild: true  # 通道其他圆弧内侧偏移反相时重建；B前基准圆滑区保留1/4—3/4直接偏移，禁止偏移后重构
    waypoint_shift_rebuild_min_progress_ratio: 0.15  # 1-kappa*d或离散前进比例不高于该值时提前触发重建
    waypoint_shift_rebuild_plateau_half_length: 0.08  # 障碍对应点前后保持完整目标偏移量的半段长度，单位m
    waypoint_shift_rebuild_bezier_handle_ratio: 0.30  # 局部重建Bezier控制柄占端点弦长的比例
    waypoint_shift_points_before: 30        # 障碍物最近路线点之前、车与障碍物之间统一偏移的点数
    waypoint_shift_points_after: 25          # 障碍物最近路线点之后的偏移点数；逻辑3重叠区前1/4保留前一个、后3/4由下一个覆盖
    waypoint_shift_confirm_scans: 3          # 同方向候选偏移连续命中这么多帧后首次提交；之后持续刷新
    waypoint_shift_release_scans: 8          # 连续这么多帧未命中后释放已提交偏移，回到原始航点
    waypoint_shift_min_change: 0.02          # 逻辑3静态冻结规划使用的最小变化，单位m
    enable_static_map_filter: true          # 是否同时用race_modify和race_keepout过滤真实墙体及软禁行区域点云
    require_map_for_lidar_assist: true      # 任一地图未收到时是否暂停需要非静态点云的辅助判断和二维码后撤检查
    static_map_occupied_threshold: 90       # race_modify真实墙体的点云过滤占据阈值
    static_map_inflation_cells: 6           # 图1物理外墙向内圆形膨胀0.15m；绿色静态和红色动态候选均过滤，地图外也过滤

    # ========================================================================
    # 逻辑3：静态绿色快照冻结路径 + 绿圈外雷达避障
    # ========================================================================

    # -------------------------- 逻辑3：静态规划 ----------------------------
    logic3_static_route_direction: clockwise  # 扫码前仅用作通道几何参考，不代表最终顺逆时针路线
    logic3_static_restriction_map_topic: /logic3_static_restriction_map  # 仅发车前绿色候选使用的Y向拓宽地图
    logic3_static_restriction_inflation_cells: 0  # 第三张地图已经显式拓宽，静态查询不再额外膨胀黑区
    logic3_static_channel_min_y: -0.20        # 支持大厅采样；静态绿色候选必须满足map.y严格大于1.00m
    logic3_static_cluster_min_points: 1       # 仅静止阶段允许1~3个远距离稀疏雷达点形成候选
    logic3_static_cluster_match_radius: 0.30  # 跨帧关联同一障碍物；仅关联身份，不代表该帧通过稳定性检查
    logic3_static_confirmation_window_seconds: 2.0  # 状态1前候选身份确认使用的滚动窗口，单位s
    logic3_static_confirmation_min_hits: 10       # 候选在滚动窗口内至少命中该帧数才分配正式ID
    logic3_static_stability_radius: 0.10      # 近距离稳定观察、采样及READY持续监视半径，单位m
    logic3_static_far_stability_radius: 0.20  # 远距离稀疏回波使用的最大稳定半径，单位m
    logic3_static_stability_near_distance: 2.0  # 障碍物不超过该雷达距离时使用0.10m，单位m
    logic3_static_stability_far_distance: 3.0   # 超过该雷达距离时使用0.20m，中间线性插值
    logic3_static_average_samples: 10        # 状态1后累计这么多个有效观测，生成最终平均绿色坐标
    logic3_static_loss_grace_seconds: 1.0    # 仅状态1后启用；判定失联后等待重捕的最长时间，单位s
    logic3_static_reacquire_radius: 0.20     # 状态1后失联ID相对固定锚点的严格重捕半径，单位m
    logic3_old_cluster_radius: 0.60           # 发车冻结后绿色点云掩码半径；圈内点不触发雷达避障且不记红点，单位m

    # --------------------- 逻辑3：可信发车与位姿锚定 -----------------------
    logic3_odom_topic: /chassis/odom
    logic3_motion_speed_threshold: 0.03
    logic3_motion_displacement_threshold: 0.01
    logic3_motion_confirm_messages: 2
    # 实测基地约x=[-0.15,0.15]、y=[-0.05,0.20]；四周再扩12cm。
    # base_link在扩展区x=[-0.27,0.27]、y=[-0.17,0.32]内时禁止判定可信发车。
    logic3_start_zone_guard_enabled: true
    logic3_start_zone_min_x: -0.15
    logic3_start_zone_max_x: 0.15
    logic3_start_zone_min_y: -0.05
    logic3_start_zone_max_y: 0.20
    logic3_start_zone_guard_margin: 0.12
    logic3_static_status_log_rate_hz: 2.0      # 发车前终端输出最终绿色点数量和map坐标的频率

    # ---------------------- 逻辑3：运行红点记录 ----------------------------
    logic3_runtime_roi_width: 3.75            # 地图坐标下以车辆为中心，X方向总宽度，单位m
    logic3_runtime_roi_height: 3.75           # 地图坐标下以车辆为中心，Y方向总高度，单位m
    logic3_runtime_restriction_map_topic: /logic3_runtime_restriction_map  # 图4；仅过滤运行红点记录
    logic3_runtime_channel_min_y: -0.20      # 动态红点采样及画图保留map.y大于等于-0.20m的簇
    logic3_runtime_cluster_match_radius: 0.35  # 运行红簇跨帧身份关联半径；小于障碍最小间距的一半，单位m
    logic3_runtime_average_samples: 5        # 已关联红簇最近多少帧做坐标平滑；不把运动轨迹累积成大点云
    logic3_red_history_merge_radius: 0.75     # 仅用于图片红圈和历史坐标归并；不参与运行轨迹关联或避障，单位m

    # ---------------------- 逻辑3：规划专用稳定坐标 ------------------------
    logic3_planning_pose_source: live_lidar_location  # 发车后仍完全沿用AMCL/lidar_location实时map定位
    logic3_odom_frame_id: odom
    logic3_pose_correction_deadband_xy: 0.005
    logic3_pose_correction_deadband_yaw: 0.003
    logic3_pose_correction_rate_xy: 0.02
    logic3_pose_correction_rate_yaw: 0.02
    logic3_pose_outlier_xy: 0.20
    logic3_pose_outlier_yaw: 0.15

    # -------------------------- 逻辑3：地图分工 -----------------------------
    # 图2：作为冻结路线图和最终路线图背景；逻辑3偏移方向只由障碍相对路线的左右侧决定
    # 图3：仅过滤发车前的静态绿色候选；话题由logic3_static_restriction_map_topic指定
    # 图4：仅过滤发车后的动态红色候选；话题由logic3_runtime_restriction_map_topic指定
    logic3_output_root: /root/D_Robot/test/dev_ws/src/origincar_system/path
    logic3_restriction_map_yaml: /root/D_Robot/test/dev_ws/src/origincar_system/map/race_keepout.yaml

    # 扫到二维码后的雷达条件倒车；数值来自雷达实跑的 1.15 profile
    qr_reverse_y_threshold: 0.5  # map.y大于该值或前方有非墙障碍时触发；回到阈值内且前方清空后退出，单位m
    qr_reverse_front_obstacle_distance: 0.6  # 前方触发/退出判断的最大距离，单位m
    qr_reverse_front_fov_deg: 160.0  # 前方扇形总视野角，可手动设置，单位degree
    qr_reverse_front_corridor_half_width: 0.4  # 前方矩形走廊半宽，可手动设置，单位m
    qr_reverse_rear_obstacle_distance: 0.45  # 后方停止判断的最大距离，单位m
    qr_reverse_rear_fov_deg: 140.0  # 后方扇形总视野角，可手动设置，单位degree
    qr_reverse_rear_corridor_half_width: 0.3  # 后方矩形走廊半宽，可手动设置，单位m
    qr_reverse_linear_speed: 0.7  # 固定倒车线速度绝对值，单位m/s
    qr_reverse_angular_speed: 0.5  # 固定倒车转向量；保留正负号

    # 倒车结束后到进入 channel 前：使用雷达实跑追点参数并叠加其雷达避障
    # -------- 进入 channel 前仅覆盖基础速度；其余追点参数沿用 channel ------
    channel_handoff_waypoint_distance: 0.4  # 到入口首点小于该距离，或穿过入口截面后结束进场速度覆盖，单位m
    channel_approach_linear_speed: 0.95  # 进场无障碍基础线速度；转弯时使用全局线性降速，单位m/s
    channel_entry_corner_smoothing_length: 0.20  # 仅圆滑偏移前基准路线的B前末段；waypoint_shift后不再拟合B

    # ---------------- channel 全程共用的雷达避障 --------------------
    channel_lidar_avoid_distance: 0.65  # 前方避障最大距离，单位m
    channel_lidar_avoid_fov_deg: 160.0  # 前方避障扇形总视野角，单位degree
    channel_lidar_corridor_half_width: 0.45  # 前方避障矩形走廊半宽，单位m
    channel_lidar_avoid_linear_speed: 0.45  # 避障覆盖时固定线速度，单位m/s
    channel_lidar_avoid_angular_gain: 3.0  # 障碍在中心线时的最大避障转向增益
    channel_lidar_direction_upper_angle_deg: 8.0  # 障碍相对角高于+8°才切换为右绕
    channel_lidar_direction_lower_angle_deg: -8.0  # 低于-8°才切换为左绕；区间内保持上次方向

    # ----------------------- 雷达公共过滤 ------------------------------
    # 倒车及channel避障共用物理地图墙体过滤；逻辑3另叠加冻结绿圈点云掩码
    lidar_scan_timeout: 0.25  # 雷达接收超过该时间未更新即停车，单位s
    lidar_enable_static_map_filter: true  # 是否过滤物理地图上的墙体点
    lidar_static_map_occupied_threshold: 50  # 占用值达到该值视为墙体
    lidar_static_map_wall_padding: 0.15  # 实时倒车/channel避障同样用图1外墙0.15m膨胀，地图外也过滤

    # 生成的channel路线已直接延伸到map起终点；本节点全程保持/cmd_vel控制权
    return_to_start_enabled: true  # 启用返程直线上的停车矩形/停车标志判定
    return_target_x: 0.0  # 返回目标及停车矩形中心的map.x，单位m
    return_target_y: 0.0  # 返回目标及停车矩形中心的map.y，单位m
    # 停车矩形：x=[-0.25,0.25]、y=[-0.40,0.25]；按base_link中心判定
    return_stop_zone_length: 0.3  # X方向总长度，单位m
    return_stop_zone_upper_half_width: 0.10  # 相对目标点的Y正方向边界，单位m
    return_stop_zone_lower_half_width: 0.20  # 相对目标点的Y负方向边界绝对值，单位m
    # 返程障碍按“障碍簇中心Y”分类；该高度只分类障碍，绝不裁剪上方障碍的偏移航点窗口
    return_obstacle_split_y: 1.0  # 中心Y严格大于此值走静态偏移；小于等于此值走实时channel雷达避障
    return_lidar_clear_cycles: 3  # 下方障碍连续清空这么多个有效控制周期后进入回线状态
    return_lidar_rejoin_lateral_tolerance: 0.12  # 回到当前已偏移规划路线此横向距离内才允许停车矩形判停，单位m
    return_lidar_rejoin_linear_speed: 0.45  # 下方障碍清空后的回线最高线速度，单位m/s
    return_follow_linear_speed: 0.85  # 仅旧版无return_route_start航点文件的兼容返程使用
    return_turn_angular_gain: 1.6  # 仅旧版兼容返程使用
    return_visual_detection_topic: /racing_obstacle_detection  # 新返程直线只取其中的停车标志
    return_visual_detection_timeout: 0.5  # 检测超过该时间未更新时停车，单位s
    # 检测框由1920x1080缩放到visual_control使用的640x480后再应用以下像素阈值
    return_visual_source_width: 1920
    return_visual_source_height: 1080
    return_visual_control_width: 640
    return_visual_control_height: 480
    return_visual_avoid_linear_speed: 0.45  # 仅旧版兼容返程的视觉避障使用
    return_visual_avoid_angular_ratio: -0.005  # 仅旧版兼容返程的视觉避障使用
    return_visual_obstacle_confidence_threshold: 0.5
    return_visual_bottom_threshold_caution: 295
    return_visual_bottom_threshold_avoid: 305
    return_visual_delta_x_ratio: 0.0
    return_visual_parking_sign_confidence_threshold: 0.7
    return_visual_parking_y_threshold: 405  # 满足置信度且停车标志中心Y达到该值就停车，不追标志

    # QR 选路、感知模式和 visual_control 挂起切换
    route_direction: auto  # 未通过二维码指定时的路线方向；auto 使用航点文件设置
    enable_qr_direction_select: true  # 是否根据二维码内容选择顺逆时针路线
    qr_topic: /qr_code  # 二维码识别结果话题
    suspend_visual_control_on_qr: true  # 扫码后立即挂起 visual_control，禁止其巡线、回线和丢线处理
    resume_visual_control_on_finish: false  # 返回起点由本节点负责；仅关闭return_to_start_enabled时作为旧流程开关
    visual_control_suspend_topic: /sign4return  # visual_control 接管状态切换话题
    visual_control_suspend_value: 5  # 通知 visual_control 挂起时发布的整数值
    visual_control_resume_value: 6  # 仅旧流程恢复visual_control时使用；返回起点流程不发布该值
    perception_full_resume_value: 9  # channel结束时只恢复YOLO完整识别，visual_control仍保持挂起
    perception_pause_value: 10  # 扫码成功后立即暂停YOLO；进场及channel已改用雷达避障
    use_qr_parity_direction: true  # 是否使用奇数顺时针、偶数逆时针的选路规则
    clockwise_qr_value: 1  # 不使用奇偶规则时代表顺时针的二维码值
    counterclockwise_qr_value: 2  # 不使用奇偶规则时代表逆时针的二维码值

    # 独立图生文拍照点；运行时插入到最近路线段，可随 waypoint_shift 避障平移
    enable_image_analysis_trigger: true  # 是否在环线中到达所选拍照点后触发一次图生文
    image_capture_clockwise_x: 3.35  # 顺时针使用的右侧车辆拍照点map坐标x，单位m
    image_capture_clockwise_y: 4.10  # 顺时针使用的右侧车辆拍照点map坐标y，单位m
    image_capture_counterclockwise_x: 0.40  # 逆时针使用的左侧车辆拍照点map坐标x，单位m
    image_capture_counterclockwise_y: 4.10  # 逆时针使用的左侧车辆拍照点map坐标y，单位m
    image_capture_radius: 0.2  # 必须真正进入此距离才算到达，且路线进度不能跳过该点，单位m
    image_capture_slow_distance: 0.5  # 距拍照点小于此距离开始限速，单位m
    image_capture_slow_speed: 0.4  # 接近拍照点时的最大线速度，单位m/s
    image_capture_angular_gain: 1.6  # 追拍照点时航向误差到下位机前轮目标转角的专用比例增益
    image_capture_stop_time: 0.2  # 到点后先停车稳定这么久再拍照，单位s
    
    image_capture_trigger_value: 8  # 发布到图生文触发话题的整数值
    image_analysis_trigger_topic: /sign4return  # 图像分析触发整数消息的发布话题

# Parameter configuration for OriginCar USB Camera

# USB Camera Node Configuration
usb_cam_node:
  ros__parameters:
    # --- Camera Settings ---
    video_device: "/dev/video0"   # Device path
    framerate: 30                 # Frames per second
    image_width: 1920              # Resolution width
    image_height: 1080          # Resolution height
    pixel_format: "mjpeg"         # Output format from camera
    io_method: "mmap"             # I/O method
    
    # --- Frame & Calibration ---
    frame_id: "usb_cam"           # Frame ID
    camera_calibration_file_path: ""
    # Publish the camera MJPEG through HbmMsg1080P loaned messages.  At 1080p
    # this avoids serializing/copying the fixed 6.2 MB hbmem message per frame.
    zero_copy: true

# MJPEG -> NV12 Codec Configuration
usb_cam_nv12_codec_node:
  ros__parameters:
    # --- Codec Settings ---
    channel: 0                # Channel ID
    in_mode: "shared_mem"     # Input through Fast DDS data-sharing
    in_format: "jpeg"         # Input format
    out_mode: "shared_mem"    # Output to Shared Memory
    out_format: "nv12"        # Output format
    input_framerate: 30
    output_framerate: -1       # Keep every frame for YOLO
    
    # --- Topics ---
    sub_topic: "/camera/image_mjpeg_hbmem" # Zero-copy MJPEG from USB camera
    pub_topic: "/camera/image_hbmem"       # Zero-copy NV12 for YOLO

# NV12 -> JPEG Codec Configuration
usb_cam_preview_codec_node:
  ros__parameters:
    # --- Codec Settings ---
    channel: 1                # Channel ID
    in_mode: "shared_mem"     # Input from Shared Memory
    in_format: "nv12"         # Input format
    out_mode: "ros"           # Output to ROS topic
    out_format: "jpeg"        # Output format
    jpg_quality: 70.0          # Good enough for QR snapshots and VLM
    input_framerate: 30
    output_framerate: 10       # Auxiliary stream; do not burden YOLO at 30 FPS

    # --- Topics ---
    sub_topic: "/camera/image_hbmem" # Zero-copy NV12 input
    pub_topic: "/camera/image"       # CompressedImage compatibility topic

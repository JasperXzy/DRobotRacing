GetLineCoordinate:
  ros__parameters:
    input_topic: /camera/image_hbmem
    output_topic: /racing_track_center_detection
    camera_frame_id: usb_cam

    model_path: /root/D_Robot/dev_ws/config/models/line_detector_resnet18_nashe_224x224_nv12.hbm
    model_input_width: 224
    model_input_height: 224

    source_width: 1920
    source_height: 1080

    # Keep the old racing_track_detection coordinate contract:
    # input image is treated as a 640x480 logical frame, bottom 640x224 crop
    # starts at y=256, and published line point is in that logical frame.
    logical_width: 640
    logical_height: 480
    crop_left: 0
    crop_top: 256
    crop_width: 640
    crop_height: 224
    output_x_offset: 0.0
    output_y_offset: 256.0

    confidence_threshold: 0.0
    qos_keep_last: 1
    log_timing: true
    log_fps: true

perception_detector_node:
  ros__parameters:
    input_topic: /camera/image_hbmem
    detection_topic: /racing_obstacle_detection
    qr_roi_topic: /camera/qr_roi/image
    camera_frame_id: usb_cam

    source_width: 1920
    source_height: 1080

    model_path: /root/D_Robot/dev_ws/config/models/yolo26m_detect_nashe_640x640_nv12_resize_default.hbm
    model_input_width: 640
    model_input_height: 640
    preprocess_type: letterbox
    class_num: 3
    class_names:
      - construction_cone
      - parking_sign
      - qr_code

    score_threshold: 0.10
    nms_threshold: 0.45
    nms_top_k: 300
    strides: [8, 16, 32]

    qr_class_name: qr_code
    qr_class_id: 2
    qr_roi_margin_ratio: 0.25
    qr_roi_min_width: 16
    qr_roi_min_height: 16
    publish_qr_roi_without_detection: false
    choose_qr_roi_policy: highest_score

    qos_keep_last: 1
    bpu_core: any
    log_timing: true
    log_fps: true
    debug_image: false

    # /sign4return 感知模式：扫码后 7 仅输出障碍物，进入 channel 后 10 全停，结束后 9 恢复
    pause_value: 10
    obstacle_only_resume_value: 7
    full_resume_value: 9
    obstacle_class_name: construction_cone

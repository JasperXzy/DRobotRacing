qr_detector_node:
  ros__parameters:
    image_topic: /camera/qr_roi/image
    process_interval: 0.0
    zbar_density: 3
    small_roi_upscale: true
    small_roi_min_size: 120
    small_roi_upscale_factor: 2.0
    stop_on_detect: true
    # 扫码后立即停掉 visual_control；perception_detector 已使用独立数值，不会被 5 关闭。
    suspend_visual_control_on_detect: true
    visual_control_suspend_topic: /sign4return
    visual_control_suspend_value: 5
    # 主控在有效二维码或Task1默认选路结束时发布10；QR节点随即退出，停止图像缓存和解码。
    task1_complete_value: 10
    # 保存二维码真正解码成功时对应的完整摄像机JPEG，而不是检测器裁剪的灰度ROI。
    save_detected_camera_frame: true
    camera_image_topic: /camera/image
    qr_frame_output_root: /root/D_Robot/test/dev_ws/src/origincar_system/path  # 自动写入最新的日期/发车时间戳目录
    qr_frame_cache_size: 60
    qr_frame_match_tolerance: 0.20

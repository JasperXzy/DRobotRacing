controller_server:
  ros__parameters:
    use_sim_time:  False
    controller_frequency: 30.0       # MPPI 建议 30Hz
    cmd_vel_topic: /cmd_vel
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker — 阿克曼放宽朝向容差，MPPI 不做最终原地旋转
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.5         # MPPI 不微调朝向，放宽到 ~28°

    # ★ MPPI 局部规划器 — 内置 Ackermann 运动模型，天然不生成原地旋转轨迹
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ━━━ 阿克曼运动模型 ━━━
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.5            # 与 SmacHybrid planner 的 minimum_turning_radius 一致

      # ━━━ 速度约束 ━━━
      vx_max: 1.0                   # 最大前进速度
      vx_min: -0.5                    # 只前进，不倒车
      vy_max: 0.0                     # ★阿克曼无横向速度★
      wz_max: 10.0                     # 最大转向角速度

      # ━━━ 采样参数 ━━━
      time_steps: 56                  # 预测步数
      model_dt: 0.05                  # 步长 → horizon = 56×0.05 = 2.8 秒
      batch_size: 1500                # 候选轨迹数（越大越优，越吃 CPU）
      vx_std: 0.2                     # 线速度采样噪声
      vy_std: 0.0                     # 阿克曼无横向
      wz_std: 0.4                     # 角速度采样噪声
      temperature: 0.3                # 越小越选最优轨迹
      gamma: 0.015                    # 平滑 vs 能耗权衡

      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 0.1
      visualize: true                 # 调试：在 RViz 显示候选轨迹
      reset_period: 1.0
      regenerate_noises: false

      # 倒车（不启用）
      enforce_path_inversion: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # ━━━ Critics 评分体系 ━━━
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic",
                "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      # 运动学约束
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # 代价地图避障
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      # 接近目标位置
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      # ★目标朝向 — 降低权重，阿克曼不强求最终朝向★
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      # 路径对齐
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false

      # 路径跟随
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # 路径朝向对齐
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
        mode: 2                     # 使用路径朝向而非固定前向

      # ★偏好前进 — 阿克曼优先前进运动★
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time:  False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      footprint: "[[0.30, 0.225], [0.30, -0.225], [-0.30, -0.225], [-0.30, 0.225]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time:  False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time:  False
      robot_radius: 0.22
      footprint: "[[0.30, 0.225], [0.30, -0.225], [-0.30, -0.225], [-0.30, 0.225]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time:  False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

map_server:
  ros__parameters:
    use_sim_time:  False
    yaml_filename: "/root/D_Robot/dev_ws/src/origincar_nav2/map/my_map.yaml"
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time:  False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time:  False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      minimum_turning_radius: 0.1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      downsample_costmap: false
      downsampling_factor: 1
      allow_primitive_interpolation: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

smoother_server:
  ros__parameters:
    use_sim_time:  False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time:  False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time:  False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
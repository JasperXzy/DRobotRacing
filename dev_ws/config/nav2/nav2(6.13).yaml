# ============================================================================
# nav2.yaml — TEB 局部规划器版本 (2025.06.13)
#
# 规划器选型:
#   MPPI: 随机采样 1000 条轨迹 → 打分 → Softmax 加权 → 输出
#   TEB:  全局路径初始化弹性带 → G2O 图优化变形 → 确定性输出
#
# TEB 优势 (5m×5m + 阿克曼场景):
#   ① 确定性优化，不会左右摇摆
#   ② CPU 极轻（无需采样数千条轨迹）
#   ③ 阿克曼原生支持 (cmd_angle_instead_rotvel)
#   ④ Homotopy Class Planning 自动选择绕障碍物方向
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time:  False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 阿克曼底盘：自定义 BT，避免 Spin 原地旋转节点（路径由 launch 文件动态注入）
    default_nav_to_pose_bt_xml: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/behavior_trees/ackermann_navigate_w_recovery.xml"
    default_nav_through_poses_bt_xml: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/behavior_trees/ackermann_navigate_through_poses_w_recovery.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# controller_server — TEB 局部规划器
# ============================================================================
controller_server:
  ros__parameters:
    use_sim_time:  False
    controller_frequency: 30.0          # 20→30，与model_dt匹配
    cmd_vel_topic: /cmd_vel
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker — 5m 场放宽超时，终点允许缓慢逼近
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5     # 0.15→0.5
      movement_time_allowance: 10.0      # 30→10

    # Goal checker — 阿克曼放宽朝向
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35            # 稍微收紧最终位置判定
      yaw_goal_tolerance: 1.2            # ~69°，比之前更看重朝向但不卡死

    # ========================================================================
    # ★ TEB (Timed Elastic Band) 局部规划器
    #
    # 原理: 将全局路径初始化为一条"弹性带"，通过 G2O 图优化器迭代变形
    #       轨迹，同时满足运动学约束、避障、最短时间等目标
    #
    # 关键参数直觉:
    #   - 越大 weight_optimaltime → 越快到达目标（但更激进）
    #   - 越大 weight_obstacle       → 离障碍物越远（但更保守）
    #   - 越大 weight_kinematics_nh  → 轨迹越符合阿克曼约束（但更"僵硬"）
    #   - 越大 weight_viapoint       → 越紧跟全局路径（但灵活性下降）
    # ========================================================================
    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # ━━━ 阿克曼底盘配置 ━━━
      cmd_angle_instead_rotvel: false
      wheelbase: 0.145                         # 轴距 (m) 
      max_vel_x: 1.15                          # 先压低速度，减少入弯甩尾
      max_vel_x_backwards: 1.00                # 允许半米级短倒车，但仍慢于前进
      max_vel_theta: 1.0                       # 再压一点转向角速度，消掉残余甩尾

      # 阿克曼转弯限制
      min_turning_radius: 0.30                 # 略放大转弯半径，避免急弯导致后轮甩

      # TEB优化用车体模型，需与costmap footprint保持一致，避免优化时按点模型贴障
      footprint_model:
        type: "polygon"
        vertices: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"

      # ━━━ 加速度限制 ━━━
      acc_lim_x: 0.30                          # 柔和加减速，减轻打滑/甩尾
      acc_lim_theta: 1.4                       # 继续降低角加速度，转向变化更柔

      # ━━━ 轨迹优化核心参数 ━━━
      dt_ref: 0.32                             # 冠军车 0.32：时间分辨率
      dt_hysteresis: 0.1
      min_samples: 3                           # 冠军车 3：最少轨迹点数
      global_plan_overwrite_orientation: False # 留给3D路径规划使用的参数，改为False
      global_plan_viapoint_sep: 0.16           # 航点约束稍放松，弯道轨迹更圆滑

      no_inner_iterations: 7                   # 增加内层优化，让弯道收敛更平滑
      no_outer_iterations: 3                   # 冠军车 3

      max_global_plan_lookahead_dist: 3.2      # 稍微看远，提前入弯但不过度拉直切角
      force_reinit_new_goal_dist: 1.0          # 冠军车 1.0：新目标>1m就重初始化整条轨迹

      feasibility_check_no_poses: 2            # 恢复轻量可行性检查，减少贴障碍轨迹
      publish_feedback: false
      allow_init_with_backwards_motion: true   # 目标在正后方时允许直接倒车初始化
      exact_arc_length: false

      # ━━━ 代价地图转换 ━━━
      costmap_converter_plugin: ""
      costmap_converter_spin_thread: true
      costmap_converter_rate: 5.0

      # ━━━ 障碍物 — 实车先保守，稳定后再逐步收紧 ━━━
      min_obstacle_dist: 0.05                  # 放回一点过障胆量，但仍留车身余量，已使用footprint，未跑
      inflation_dist: 0.16                     # 缩小软缓冲，窄障碍间更愿意穿过去，0.26-0.16，未跑
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 1.5 # 后方障碍保留更久，避免倒车蹭障碍

      # ╔══════════════════════════════════════════════════════╗
      # ║ ★★★ 冠军车优化权重（国一车实测）★★★            ║
      # ╚══════════════════════════════════════════════════════╝
      penalty_epsilon: 0.05                    # 冠军车 0.11→0.15：惩罚更圆滑，减少轨迹抖动 # ->0.05减小速度限制，未跑

      # 速度/加速度约束
      weight_max_vel_x: 4.0
      weight_max_vel_theta: 10.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 30.0

      # 运动学约束
      weight_kinematics_nh: 700.0              # 更严格约束非完整运动，减少横摆
      weight_kinematics_forward_drive: 180.0   # 保留前进偏好，但不再锁死倒车
      weight_kinematics_turning_radius: 1000.0 # ★冠军车 1000：硬约束转弯

      # 目标优化
      weight_optimaltime: 25.0                 # 降低抢时间倾向，减少急打方向
      weight_obstacle: 220.0                   # 降低障碍恐惧，减少过障前犹豫
      weight_viapoint: 18.0                    # 少贴折线航点，减少过弯顿挫
      weight_inflation: 1.2                    # 软缓冲别太强，允许靠近但不贴障，障碍物软缓冲权重
      weight_adapt_factor: 2.0

      # ━━━ Homotopy Class Planning — 冠军车关闭 ━━━
      enable_homotopy_class_planning: false    # ★关了：单轨迹稳定不抖
      enable_multithreading: false
      max_number_classes: 2
      selection_cost_hysteresis: 1.0
      selection_obst_cost_scale: 100.0
      selection_viapoint_cost_scale: 1.0
      selection_alternative_time_cost: false
      visualize_hc_graph: false

      # ━━━ 目标到达 ━━━
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 1.2
      free_goal_vel: True                    # ★冠军车 false，7.7上午修改：True，允许到达点仍有残余速度，减少甩尾

      # ━━━ 恢复行为 ━━━
      shrink_horizon_backup: true
      shrink_horizon_min_duration: 10.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# local_costmap — 局部代价地图
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0            # TEB 不需要过高更新频率
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time:  False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.5        # 障碍代价衰减放缓，让局部规划更早避开
        inflation_radius: 0.22          # 局部障碍膨胀再小一点，过障更果断
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5       # 2.5→3.5，增大感知范围
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time:  False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

# ============================================================================
# global_costmap — 全局代价地图
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time:  False
      robot_radius: 0.15
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0       # 5m赛道内保持全局感知范围不过度吃远处噪点
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True       # False→True，确保收到地图
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0        # 全局代价衰减更慢，路径别贴障碍物边
        inflation_radius: 0.20          # 全局障碍膨胀略小，减少绕行保守度
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time:  False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

# ============================================================================
# map_server — 静态地图服务
# ============================================================================
map_server:
  ros__parameters:
    use_sim_time:  False
    yaml_filename: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/map/my_map.yaml"
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time:  False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ============================================================================
# planner_server — 全局规划器 (smac_planner 的 Hybrid-A* 插件)
# ============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0       # 5m场不需要频繁重新规划
    use_sim_time:  False
    # ★ Smac Hybrid-A* — 状态空间含 (x,y,theta)，天然适配阿克曼底盘
    #     REEDS_SHEPP + 高倒车惩罚：背向目标时可短距倒车调头，避免绕大圈
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                  # 目标容差 (m)
      downsample_costmap: false       # 5m小场不下采样
      downsampling_factor: 1
      allow_unknown: false            # 不穿越未知区域
      max_iterations: 5000            # 远方目标增加迭代
      max_planning_time: 5.0          # 放宽时间限制
      motion_model_for_search: "REEDS_SHEPP"   # 允许倒车但严格惩罚
      angle_quantization_bins: 24     # 15°精度，40→24 大幅加速启发式表计算
      minimum_turning_radius: 0.30    # 跟 TEB 一致，避免全局路径给急弯
      analytic_expansion_ratio: 3.5   # 分析扩展加速搜索
      cache_obstacle_heuristic: true  # 缓存启发式加速重规划
      lookup_table_size: 9.0          # 覆盖全局地图 (359×0.025≈9m)，15→9 大幅减少启动计算
      reverse_penalty: 35.0           # 允许短距离倒车，长距离仍更偏向前进
      change_penalty: 1.0             # 0.6→1.0 更少转向变化
      non_straight_penalty: 3.0       # 2.0→3.0 大幅偏向直线，拒绝绕弯
      cost_penalty: 3.0           # 降低全局代价惩罚，别过度绕开障碍
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# smoother_server — 路径平滑器 (TEB 场景下可能不需要，保留以备用)
# ============================================================================
smoother_server:
  ros__parameters:
    use_sim_time:  False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ============================================================================
# behavior_server — 恢复行为
# 注意: TEB 有内置的 shrink_horizon_backup 恢复机制，
#       behavior_server 的 DriveOnHeading/Backup 作为最后兜底
# ============================================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time:  False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time:  False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# =========================================================================
# AMCL 定位 — 替代 SLAM Toolbox localization 模式
# 粒子滤波定位，轻量级，发布 map→odom TF
# =========================================================================
amcl:
  ros__parameters:
    use_sim_time: False

    # 帧定义
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # 传感器
    scan_topic: /scan
    laser_model_type: "likelihood_field"

    # 运动模型（阿克曼底盘用差分近似，2D 定位足够）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # 收到地图后立即初始化粒子（均匀分布），不等待 /initialpose
    set_initial_pose: true

    # 粒子数
    max_particles: 2000
    min_particles: 500

    # 更新阈值 — 机器人必须移动/旋转超过此值才重新采样
    update_min_d: 0.10
    update_min_a: 0.10

    # 重采样
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # 恢复（AMCL 内置随机粒子注入，应对绑架）
    recovery_alpha_fast: 0.01
    recovery_alpha_slow: 0.001

    # 激光模型参数
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # Beam skip
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 运动噪声
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    save_pose_rate: 0.5

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# ============================================================================
# nav2.yaml — TEB 局部规划器版本 (2025.06.13)
#
# 与 MPPI 版本的区别:
#   MPPI: 随机采样 1000 条轨迹 → 打分 → Softmax 加权 → 输出
#   TEB:  全局路径初始化弹性带 → G2O 图优化变形 → 确定性输出
#
# TEB 优势 (5m×5m + 阿克曼场景):
#   ① 确定性优化，不会左右摇摆
#   ② CPU 极轻（无需采样数千条轨迹）
#   ③ 阿克曼原生支持 (cmd_angle_instead_rotvel)
#   ④ Homotopy Class Planning 自动选择绕障碍物方向
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time:  False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 阿克曼底盘：用自定义 BT 替代默认 BT，避免 Spin 原地旋转节点
    default_nav_to_pose_bt_xml: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/behavior_trees/ackermann_navigate_w_recovery.xml"
    default_nav_through_poses_bt_xml: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/behavior_trees/ackermann_navigate_through_poses_w_recovery.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# controller_server — TEB 局部规划器
# ============================================================================
controller_server:
  ros__parameters:
    use_sim_time:  False
    controller_frequency: 30.0          # 20→30 对齐MPPI，与model_dt匹配
    cmd_vel_topic: /cmd_vel
    min_x_velocity_threshold: 1.0
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker — 5m 场放宽超时，终点允许缓慢逼近
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5     # 0.15→0.5 对齐MPPI
      movement_time_allowance: 10.0      # 30→10 对齐MPPI

    # Goal checker — 阿克曼放宽朝向
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40            # 0.30→0.40 对齐MPPI
      yaw_goal_tolerance: 2.0            # ~57°, 不卡最终姿态

    # ========================================================================
    # ★ TEB (Timed Elastic Band) 局部规划器
    #
    # 原理: 将全局路径初始化为一条"弹性带"，通过 G2O 图优化器迭代变形
    #       轨迹，同时满足运动学约束、避障、最短时间等目标
    #
    # 关键参数直觉:
    #   - 越大 weight_optimaltime → 越快到达目标（但更激进）
    #   - 越大 weight_obstacle       → 离障碍物越远（但更保守）
    #   - 越大 weight_kinematics_nh  → 轨迹越符合阿克曼约束（但更"僵硬"）
    #   - 越大 weight_viapoint       → 越紧跟全局路径（但灵活性下降）
    # ========================================================================
    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # ━━━ 阿克曼底盘配置 ━━━
      cmd_angle_instead_rotvel: false         # false=输出Twist(angular.z)，底盘STM32自己做阿克曼转换
      wheelbase: 0.20                          # 轴距 (m)，你的车实测值
      max_vel_x: 1.0                           # 最大前进速度 (m/s)，0.5→1.0 不再龟速
      max_vel_x_backwards: 1.5                 # 最大倒车速度
      max_vel_theta: 10.0                       # 最大转向角速度 (仅 cmd_angle=false 时用)

      # 阿克曼转弯限制
      min_turning_radius: 0.30                 # 与MPPI AckermannConstraints一致，0.50→0.20

      # ━━━ 加速度限制 ━━━
      acc_lim_x: 3.0                           # 线加速度 (m/s²)
      acc_lim_theta: 2.0                       # 角加速度 (rad/s²)

      # ━━━ 轨迹优化核心参数 ━━━
      dt_ref: 0.3                              # 轨迹点时间间隔 (s)
                                               # 越小=轨迹越密=优化更精细但更慢
      dt_hysteresis: 0.1                       # 重规划滞后时间

      no_inner_iterations: 5                   # 内层迭代: 轨迹点位置优化
      no_outer_iterations: 4                   # 外层迭代: 释放被卡住的点

      max_global_plan_lookahead_dist: 3.0      # 只看路径前方 3m（5m 场 = 半场视野）
      global_plan_overwrite_orientation: true  # 用路径朝向初始化轨迹点

      feasibility_check_no_poses: 4            # 每次检查前 4 个轨迹点是否可执行
      publish_feedback: false                  # 不发布调试 marker

      # ━━━ 代价地图 ━━━
      costmap_converter_plugin: ""             # 空=用默认 costmap
      costmap_converter_spin_thread: false
      costmap_converter_rate: 5.0

      # ━━━ 障碍物 ━━━
      min_obstacle_dist: 0.20                  # 最小离障距离 (m)，0.15→0.20
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 2.0 # 只关心车后 2m 内障碍
      obstacle_poses_affected: 30              # 每条边关联障碍物栅格上限

      # ━━━ 优化权重（TEB 的"Critics"）━━━
      # 每一项乘以对应的代价项，总和最小化

      weight_kinematics_nh: 1000.0             # ★ 阿克曼运动学约束（权重极高，强制满足）
      weight_kinematics_forward_drive: 1.0     # 前进偏好（>0 倾向前进，<0 倾向倒退）
      weight_optimaltime: 15.0                 # ★ 最短时间: 增大提速，10→15
      weight_obstacle: 20.0                    # ★ 避障: 50→20，避免窄空间卡死
      weight_viapoint: 0.5                     # 路径点跟踪: 降低以允许TEB平滑穿过中间航点
      weight_adapt_factor: 2.0                 # 自适应权重: 窄空间自动放大避障权重

      # ━━━ Homotopy Class Planning（"障碍物左边绕还是右边绕"）━━━
      enable_homotopy_class_planning: true     # ★ 启动拓扑路径选择
      enable_multithreading: true              # 多条备选路径并行优化
      max_number_classes: 4                    # 最多 4 条备选
      selection_cost_hysteresis: 1.0           # 切换阈值: 新路径需要显著优于当前才切换
      selection_obst_cost_scale: 2.0           # 选择时避障代价权重
      selection_viapoint_cost_scale: 1.0       # 选择时路径对齐权重
      selection_alternative_time_cost: false   # 不因时间代价切换路径
      roadmap_graph_no_samples: 15             # 路标图采样点
      roadmap_graph_area_width: 5.0              # 路标图宽度 = 5m 场地
      h_signature_prescaler: 1.0
      h_signature_threshold: 0.1               # H-signature 区分阈值: 越低越敏感
      obstacle_keypoint_offset: 0.1            # 障碍物关键点偏置
      visualize_hc_graph: false                # 不显示 HC 图（省资源）

      # ━━━ 目标到达 ━━━
      xy_goal_tolerance: 0.30                  # 0.30→0.40 对齐MPPI，避免终点卡住
      yaw_goal_tolerance: 2.0
      free_goal_vel: true                      # 中间航点不停车，TEB规划穿过目标点的轨迹

      # ━━━ 恢复行为（TEB 内置，无需 behavior_server 的 DriveOnHeading/Backup）━━━
      shrink_horizon_backup: true              # 卡住时缩短视野，允许倒车脱困
      allow_init_with_backwards_motion: false  # 不从倒车开始（起点出发，没必要）
      exact_arc_length: false

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# local_costmap — 局部代价地图
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0            # TEB 不需要过高更新频率
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time:  False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0        # 8.0→5.0 对齐MPPI
        inflation_radius: 0.20          # 0.12→0.25 对齐MPPI
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5       # 2.5→3.5 对齐MPPI，增大感知范围
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time:  False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

# ============================================================================
# global_costmap — 全局代价地图
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time:  False
      robot_radius: 0.18
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0       # 3.0→5.0 对齐MPPI，增大感知范围
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True       # False→True 对齐MPPI，确保收到地图
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0        # 8.0→3.0 对齐MPPI
        inflation_radius: 0.30          # 0.12→0.35 对齐MPPI
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time:  False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

# ============================================================================
# map_server — 静态地图服务
# ============================================================================
map_server:
  ros__parameters:
    use_sim_time:  False
    yaml_filename: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/map/my_map.yaml"
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time:  False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ============================================================================
# planner_server — 全局规划器 (smac_planner 的 Hybrid-A* 插件)
# ============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0       # 5m场不需要频繁重新规划
    use_sim_time:  False
    # ★ Smac Hybrid-A* — 状态空间含 (x,y,theta)，天然适配阿克曼底盘
    #     REEDS_SHEPP + 高倒车惩罚：背向目标时可短距倒车调头，避免绕大圈
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                  # 目标容差 (m)
      downsample_costmap: false       # 5m小场不下采样
      downsampling_factor: 1
      allow_unknown: false            # 不穿越未知区域
      max_iterations: 5000            # 远方目标增加迭代
      max_planning_time: 5.0          # 放宽时间限制
      motion_model_for_search: "REEDS_SHEPP"   # 允许倒车但严格惩罚
      angle_quantization_bins: 40     # 9°精度，启动快的多（64→40）
      minimum_turning_radius: 0.20    # 与MPPI AckermannConstraints一致
      analytic_expansion_ratio: 3.5   # 分析扩展加速搜索
      cache_obstacle_heuristic: true  # 缓存启发式加速重规划
      lookup_table_size: 15.0         # 限制启发式查找表（默认800太大了）
      reverse_penalty: 50.0           # 极重倒车惩罚，禁止屁股朝向目标
      change_penalty: 0.3             # 转向变化更平缓
      non_straight_penalty: 1.45      # 路径先直走再拐弯，更平滑
      cost_penalty: 2.0
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# smoother_server — 路径平滑器 (TEB 场景下可能不需要，保留以备用)
# ============================================================================
smoother_server:
  ros__parameters:
    use_sim_time:  False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ============================================================================
# behavior_server — 恢复行为
# 注意: TEB 有内置的 shrink_horizon_backup 恢复机制，
#       behavior_server 的 DriveOnHeading/Backup 作为最后兜底
# ============================================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time:  False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time:  False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

# =========================================================================
# AMCL 定位 — 替代 SLAM Toolbox localization 模式
# 粒子滤波定位，轻量级，发布 map→odom TF
# =========================================================================
amcl:
  ros__parameters:
    use_sim_time: False

    # 帧定义
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # 传感器
    scan_topic: /scan
    laser_model_type: "likelihood_field"

    # 运动模型（阿克曼底盘用差分近似，2D 定位足够）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # 收到地图后立即初始化粒子（均匀分布），不等待 /initialpose
    set_initial_pose: true

    # 粒子数
    max_particles: 2000
    min_particles: 500

    # 更新阈值 — 机器人必须移动/旋转超过此值才重新采样
    update_min_d: 0.10
    update_min_a: 0.10

    # 重采样
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # 恢复（AMCL 内置随机粒子注入，应对绑架）
    recovery_alpha_fast: 0.01
    recovery_alpha_slow: 0.001

    # 激光模型参数
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # Beam skip
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 运动噪声
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    save_pose_rate: 0.5

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False
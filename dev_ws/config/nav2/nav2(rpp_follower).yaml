# ============================================================================
# nav2(rpp_follower).yaml - Smac Hybrid-A* + RPP 路径跟随版本
#
# Smac Hybrid-A* 负责生成满足 0.30 m 最小转弯半径的前进路径。
# Regulated Pure Pursuit 负责稳定跟随路径，并按曲率和障碍代价降速。
# RPP 不执行原地对正；最终 yaw 容差近似不受约束。
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time:  False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 阿克曼底盘：自定义 BT，避免 Spin 原地旋转节点（路径由 launch 文件动态注入）
    default_nav_to_pose_bt_xml: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/behavior_trees/ackermann_navigate_w_recovery.xml"
    default_nav_through_poses_bt_xml: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/behavior_trees/ackermann_ysvv_rpp_through_poses_window.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - origincar_nav2_adjust_blocked_goals_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# controller_server - Regulated Pure Pursuit 路径跟随器
# ============================================================================
controller_server:
  ros__parameters:
    use_sim_time:  False
    controller_frequency: 30.0
    cmd_vel_topic: /cmd_vel
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 小车低速过弯时仍允许较小但持续的位移。
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 5.0

    # 位置仍用于窗口交接；朝向近似不参与到达判定。
    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.283185307

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: True
      # 避免低速进入弯道时前视点贴近车头，造成曲率和转向指令阶跃。
      min_lookahead_dist: 0.28
      max_lookahead_dist: 0.55
      lookahead_time: 0.70
      transform_tolerance: 0.10

      # 接近窗口末端时降速，但不要求车头对准窗口末点姿态。
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.20
      use_rotate_to_heading: False
      rotate_to_heading_min_angle: 3.141592654
      rotate_to_heading_angular_vel: 0.0
      max_angular_accel: 2.0
      allow_reversing: False

      # 曲率大时把速度压低，使 omega 保持在底盘可用范围内。
      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.10

      # cost_scaling_factor 必须与 local_costmap inflation_layer 一致。
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.5

      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 0.7
      max_robot_pose_search_dist: 2.0
      use_interpolation: True

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False
# ============================================================================
# local_costmap — 局部代价地图
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time:  False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.5        # 障碍代价衰减放缓，让局部规划更早避开
        inflation_radius: 0.22          # 局部障碍膨胀再小一点，过障更果断
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5       # 2.5→3.5，增大感知范围
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time:  False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

# ============================================================================
# global_costmap — 全局代价地图
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time:  False
      robot_radius: 0.15
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0       # 5m赛道内保持全局感知范围不过度吃远处噪点
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True       # False→True，确保收到地图
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0        # 全局代价衰减更慢，路径别贴障碍物边
        inflation_radius: 0.22          # 全局障碍膨胀略小，减少绕行保守度
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time:  False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

# ============================================================================
# map_server — 静态地图服务
# ============================================================================
map_server:
  ros__parameters:
    use_sim_time:  False
    yaml_filename: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/map/my_map.yaml"
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time:  False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ============================================================================
# planner_server - Smac Hybrid-A* 阿克曼全局规划器
# ============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0       # 5m场不需要频繁重新规划
    use_sim_time:  False
    # Smac Hybrid-A* 状态空间包含 (x, y, theta)，适配阿克曼底盘。
    # DUBIN 只生成前进路径，与 RPP allow_reversing=False 保持一致。
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.4                  # 目标容差 (m)
      downsample_costmap: false       # 5m小场不下采样
      downsampling_factor: 1
      allow_unknown: false            # 不穿越未知区域
      max_iterations: 5000            # 远方目标增加迭代
      max_planning_time: 5.0          # 放宽时间限制
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 64     # 15°精度，40→24 大幅加速启发式表计算（越小越宽松）
      minimum_turning_radius: 0.32    # 跟 TEB 一致，避免全局路径给急弯
      analytic_expansion_ratio: 3.5   # 分析扩展加速搜索
      cache_obstacle_heuristic: true  # 缓存启发式加速重规划
      lookup_table_size: 9.0          # 覆盖全局地图 (359×0.025≈9m)，15→9 大幅减少启动计算
      reverse_penalty: 35.0           # DUBIN 不使用倒车，该参数仅作兼容保留
      change_penalty: 1.0             # 0.6→1.0 更少转向变化
      non_straight_penalty: 3.0       # 2.0→3.0 大幅偏向直线，拒绝绕弯
      cost_penalty: 3.0           # 降低全局代价惩罚，别过度绕开障碍
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

# ============================================================================
# smoother_server - 保留给其他 BT；YSVV RPP 树不重复平滑 Smac 路径
# ============================================================================
smoother_server:
  ros__parameters:
    use_sim_time:  False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ============================================================================
# velocity_smoother — 速度输出平滑器
# controller_server 输出 /cmd_vel_nav，经本节点限加速度后再发布 /cmd_vel 给底盘
# ============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    # 与 controller_frequency 对齐，并单独限制转向指令变化率。
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 0.75]
    min_velocity: [0.00, 0.0, -0.75]
    max_accel: [0.60, 0.0, 0.70]
    max_decel: [-0.80, 0.0, -0.90]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3

# ============================================================================
# behavior_server - 阿克曼恢复行为
# ============================================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time:  False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time:  False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# =========================================================================
# AMCL 定位 — 替代 SLAM Toolbox localization 模式
# 粒子滤波定位，轻量级，发布 map→odom TF
# =========================================================================
amcl:
  ros__parameters:
    use_sim_time: False

    # 帧定义
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # 传感器
    scan_topic: /scan
    laser_model_type: "likelihood_field"

    # 运动模型（阿克曼底盘用差分近似，2D 定位足够）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # 收到地图后立即初始化粒子（均匀分布），不等待 /initialpose
    set_initial_pose: true

    # 粒子数
    max_particles: 2000
    min_particles: 500

    # 更新阈值 — 机器人必须移动/旋转超过此值才重新采样
    update_min_d: 0.10
    update_min_a: 0.10

    # 重采样
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # 恢复（AMCL 内置随机粒子注入，应对绑架）
    recovery_alpha_fast: 0.01
    recovery_alpha_slow: 0.001

    # 激光模型参数
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # Beam skip
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 运动噪声
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    save_pose_rate: 0.5

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

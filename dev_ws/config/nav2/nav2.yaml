bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time:  False
# 局部规划器 MPPIController 参数配置，针对阿克曼底盘优化
controller_server:
  ros__parameters:
    use_sim_time:  False
    controller_frequency: 30.0      # 与 model_dt=0.06 对齐，避免 MPPI 报 controller period > model dt
    cmd_vel_topic: /cmd_vel
    min_x_velocity_threshold: 1.0
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker — 阿克曼不强求最终朝向，到达即走
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 2.0          # 极度放宽朝向（~115°），到达位置即认为完成

    
    # ★ MPPI 局部规划器 — 内置 Ackermann 运动模型，天然不生成原地旋转轨迹
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ━━━ 阿克曼运动模型 ━━━
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.20            # r = v/ω = 0.25/1.25 ≈ 0.2，与键盘遥控能力匹配

      # ━━━ 速度约束（匹配键盘遥控: Linear=0.25, Angular=3.14）━━━
      vx_max: 2.0                    # 最大前进速度
      vx_min: -0.3               # 收紧倒车（DUBIN路径无需倒车）
      vy_max: 0.0                     # ★阿克曼无横向速度★
      wz_max: 10.0                   # 最大转向角速度
      wz_min: 0.05                  # 允许精细角速度修正（原0.3太大，无法小幅度调整）

      # ━━━ 采样参数 ━━━
      time_steps: 80                  # 预测步数 → horizon = 80×0.06 = 4.8 秒
      model_dt: 0.06                  # 步长增大 → 4.8s 内看 5.5m（1.15m/s 时），跳出局部最优
      batch_size: 1000               # 候选轨迹数增加，更好覆盖解空间
      vx_std: 0.3                     # Smac路径已优，降噪减少摆动
      vy_std: 0.0                     # 阿克曼无横向
      wz_std: 0.5                     # 降噪，Smac朝向已准无需激进采样
      temperature: 0.25               # 果断选最优，Smac路径可靠不再需要大量探索
      gamma: 0.015                    # 略增平滑惩罚，抑制左右摇摆

      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 0.1
      visualize: true                 # 调试：在 RViz 显示候选轨迹
      reset_period: 1.0
      regenerate_noises: false

      # 倒车 — DUBIN已输出纯前向路径，关闭局部倒车避免诡异倒退
      enforce_path_inversion: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # ━━━ Critics 评分体系 ━━━
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic",
                "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      # 运动学约束
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5              # 收紧运动学约束，减少激进转角导致的摆动

      # 代价地图避障
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0              # 降低代价惩罚，空旷区更敢提速
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      # 接近目标位置 — 全程活跃，远距离也有拉力引导沿路径走
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 50.0   # 全程有效（1.4→50），远目标不丢拉力

      # ★目标朝向 — 全程活跃，远距离也保持朝向引导★
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.1
        threshold_to_consider: 50.0   # 全程有效（0.5→50）

      # 路径对齐 — Smac路径已精准，降低权重减少过度修正
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0              # 适中（5.0太高反而导致矫枉过正）
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 50.0   # 全程有效
        offset_from_furthest: 20      # 收窄容错段（25→20），更快收敛到路径
        use_path_orientations: false

      # 路径跟随
      PathFollowCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # 路径朝向对齐 — Smac朝向已准，适中权重即可
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5              # 适中（3.0太高，Smac本身的朝向就对了）
        offset_from_furthest: 4
        threshold_to_consider: 50.0   # 全程有效
        max_angle_to_furthest: 1.5
        forward_preference: true
        mode: 2                     # 使用路径朝向而非固定前向

      # ★偏好前进 — 强前向偏好，杜绝无故倒车★
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0              # 强前向偏好，DUBIN路径下倒车没意义
        threshold_to_consider: 50.0   # 全程有效

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0       # 提高更新频率，快速清除消失的障碍物
      publish_frequency: 5.0        # 可视化发布频率
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time:  False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0        # 代价衰减更缓，提前感知障碍物
        inflation_radius: 0.25          # 扩大膨胀区（0.15→0.35），远离障碍物
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0      # 增大清除范围，快速清除移动障碍物
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5      # 增大障碍物标记范围
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time:  False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time:  False
      robot_radius: 0.18
      footprint: "[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0      # 增大清除范围，快速清除移动障碍物
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0      # 增大障碍物标记范围
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0        # 代价衰减更缓，提前感知障碍物
        inflation_radius: 0.35          # 扩大膨胀区（0.15→0.35），远离障碍物
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time:  False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time:  False

map_server:
  ros__parameters:
    use_sim_time:  False
    yaml_filename: "/root/D_Robot/dev_ws/install/origincar_nav2/share/origincar_nav2/map/my_map.yaml"
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time:  False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0       # 5m场不需要频繁重新规划
    use_sim_time:  False
    # ★ Smac Hybrid-A* — 状态空间含 (x,y,theta)，天然适配阿克曼底盘
    #     REEDS_SHEPP + 高倒车惩罚：背向目标时可短距倒车调头，避免绕大圈
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                  # 目标容差 (m)
      downsample_costmap: false       # 5m小场不下采样
      downsampling_factor: 1
      allow_unknown: false            # 不穿越未知区域
      max_iterations: 5000            # 远方目标增加迭代
      max_planning_time: 5.0          # 放宽时间限制
      motion_model_for_search: "REEDS_SHEPP"   # 允许倒车但严格惩罚
      angle_quantization_bins: 40     # 9°精度，启动快的多（64→40）
      minimum_turning_radius: 0.20    # 与MPPI AckermannConstraints一致
      analytic_expansion_ratio: 3.5   # 分析扩展加速搜索
      cache_obstacle_heuristic: true  # 缓存启发式加速重规划
      lookup_table_size: 15.0         # 限制启发式查找表（默认800太大了）
      reverse_penalty: 50.0           # 极重倒车惩罚，禁止屁股朝向目标
      change_penalty: 0.3             # 转向变化更平缓
      non_straight_penalty: 1.45      # 路径先直走再拐弯，更平滑
      cost_penalty: 2.0

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time:  False

smoother_server:
  ros__parameters:
    use_sim_time:  False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time:  False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time:  False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# =========================================================================
# AMCL 定位 — 替代 SLAM Toolbox localization 模式
# 粒子滤波定位，轻量级，发布 map→odom TF
# =========================================================================
amcl:
  ros__parameters:
    use_sim_time: False

    # 帧定义
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # 传感器
    scan_topic: /scan
    laser_model_type: "likelihood_field"

    # 运动模型（阿克曼底盘用差分近似，2D 定位足够）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # 收到地图后立即初始化粒子（均匀分布），不等待 /initialpose
    set_initial_pose: true

    # 粒子数
    max_particles: 2000
    min_particles: 500

    # 更新阈值 — 机器人必须移动/旋转超过此值才重新采样
    update_min_d: 0.10
    update_min_a: 0.10

    # 重采样
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # 恢复（AMCL 内置随机粒子注入，应对绑架）
    recovery_alpha_fast: 0.01
    recovery_alpha_slow: 0.001

    # 激光模型参数
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # Beam skip
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 运动噪声
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    save_pose_rate: 0.5

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# Parameter configuration for Chassis Driver
/chassis_driver_node:
  ros__parameters:
    usart_port_name: "/dev/chassis"
    serial_baud_rate: 115200
    cmd_vel: "chassis/cmd_vel"
    akm_cmd_vel: "chassis/ackermann_cmd"
    odom_frame_id: "odom"
    robot_frame_id: "base_link"
    gyro_frame_id: "gyro_link"

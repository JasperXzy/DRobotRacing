# Parameter configuration for Aurora930 Camera
/depth_camera/depth_camera_node:
  ros__parameters:
    # --- Stream Enablers ---
    rgb_enable: true
    ir_enable: false
    depth_enable: true
    rgbd_enable: false
    point_cloud_enable: false

    # --- Hardware/SDK Configuration ---
    resolution_mode_index: 2
    boot_order: 1
    ir_fps: 15
    rgb_fps: 15
    usb_port_number: ""
    
    # --- Image Processing ---
    threshold_size: 110
    depth_correction: true
    align_mode: true
    laser_power: 1.0
    minimum_filter_depth_value: 150
    maximum_filter_depth_value: 4000
    
    # --- Exposure & Gain ---
    exposure_enable: false
    exposure_time: 1
    gain_enable: false
    gain_value: 20
    
    # --- Logging & Maintenance ---
    log_dir: "/tmp/"
    stream_sdk_log_enable: true
    heart_enable: false
    update_file_path: ""

# RGB to NV12 Codec Configuration
depth_camera_rgb_nv12_codec_node:
  ros__parameters:
    # --- Codec Settings ---
    channel: 2                # Channel ID
    in_mode: "ros"            # Input from ROS topic
    in_format: "bgr8"         # Input format
    out_mode: "shared_mem"    # Output to Shared Memory
    out_format: "nv12"        # Output format
    
    # --- Topics ---
    sub_topic: "/depth_camera/rgb/image_raw"       # Subscribe to depth camera RGB
    pub_topic: "/depth_camera/rgb/image_hbmem"     # Publish shared memory handle

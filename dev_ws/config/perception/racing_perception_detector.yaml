racing_perception_detector_node:
  ros__parameters:
    input_topic: /camera/image_hbmem
    detection_topic: /racing_obstacle_detection
    qr_roi_topic: /camera/qr_roi/image
    camera_frame_id: usb_cam

    source_width: 1920
    source_height: 1080

    model_path: /root/D_Robot/test_ws/config/models/yolo26_det_bpu_nashe_640x640_nv12.hbm
    model_input_width: 640
    model_input_height: 640
    preprocess_type: letterbox
    class_num: 3
    class_names:
      - construction_cone
      - parking_sign
      - qr_code

    score_threshold: 0.25
    nms_threshold: 0.45
    nms_top_k: 300
    strides: [8, 16, 32]

    qr_class_name: qr_code
    qr_class_id: 2
    qr_roi_margin_ratio: 0.25
    qr_roi_min_width: 16
    qr_roi_min_height: 16
    publish_qr_roi_without_detection: false
    choose_qr_roi_policy: highest_score

    qos_keep_last: 1
    bpu_core: any
    log_timing: true
    log_fps: true
    debug_image: false

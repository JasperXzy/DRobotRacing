map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /root/D_Robot/dev_ws/src/origincar_nav2/map/my_map.yaml
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.50
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      # The competition start pose is the map-coordinate origin.  The previous
      # channel-route start (1.95, 1.80) shifted the whole robot/scan up-right.
      x: 0.0
      y: 0.0
      z: 0.0
      # Default assumes the chassis is physically facing map +X at startup.
      # Override with launch argument initial_yaw or RViz 2D Pose Estimate.
      yaw: 0.0

    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 5.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    z_hit: 0.60
    z_rand: 0.35
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.20
    lambda_short: 0.10
    do_beamskip: true
    beam_skip_distance: 0.50
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.04
    update_min_a: 0.04
    resample_interval: 1
    recovery_alpha_fast: 0.01
    recovery_alpha_slow: 0.001
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    save_pose_rate: 0.50

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      # Keep each dense through-pose meaningful (route spacing is about 0.05 m).
      tolerance: 0.05
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 2500
      max_on_approach_iterations: 500
      max_planning_time: 0.18
      motion_model_for_search: DUBIN
      angle_quantization_bins: 48
      minimum_turning_radius: 0.32
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.5
      cache_obstacle_heuristic: true
      lookup_table_size: 9.0
      reverse_penalty: 35.0
      change_penalty: 0.80
      non_straight_penalty: 1.20
      cost_penalty: 4.50
      retrospective_penalty: 0.025

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.15, 0.095], [0.15, -0.095], [-0.15, -0.095], [-0.15, 0.095]]'
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.10
          obstacle_max_range: 4.50
          raytrace_min_range: 0.10
          raytrace_max_range: 5.00
          observation_persistence: 0.30
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 2.5
      always_send_full_costmap: true

  global_costmap_client:
    ros__parameters:
      use_sim_time: false

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

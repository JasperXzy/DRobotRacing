# test_bringup 只启动 map_server 和 AMCL，因此这里只保留它们真正读取的参数。
map_server:
  ros__parameters:
    use_sim_time: false
    # 启动文件默认使用 origincar_system/map/race_modify.yaml。
    yaml_filename: /root/D_Robot/dev_ws/src/origincar_system/map/race_modify.yaml
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    use_sim_time: false

    # 坐标系与雷达输入
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan

    # 定位与运动模型
    laser_model_type: likelihood_field_prob
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.3
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # 粒子滤波
    max_particles: 1500
    min_particles: 350
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    # 启用保守自适应恢复，降低临时障碍触发大量随机粒子的风险。
    recovery_alpha_fast: 0.02
    recovery_alpha_slow: 0.001

    # 激光匹配
    laser_max_range: 5.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 0.5
    max_beams: 150
    z_hit: 0.8
    z_rand: 0.2
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.15
    lambda_short: 0.1

    # Beam skip
    # 忽略被圆锥等未知临时障碍物遮挡、无法与固定外墙匹配的激光束。
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 里程计运动噪声
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    save_pose_rate: 0.5

smac_pid:
  ros__parameters:
    # NavFn plans in map; high-rate PID tracking uses the continuous odom frame.
    global_frame: map
    tracking_frame: odom
    base_frame: base_link

    # Existing competition channel route. Top-level route_direction is clockwise.
    route_file: /root/D_Robot/dev_ws/nav_legacy/src/smac_pid/config/path1.yaml
    route_direction: auto
    route_closed: true

    # Send every ordered route point ahead of the current route projection in one
    # ComputePathThroughPoses request. For a closed route this is one complete lap;
    # the duplicate closing endpoint is removed when the route is loaded.
    # Blocked/inflated points are still removed so A* is free to detour around obstacles.
    constraint_mode: full_route
    # During each replan, route points within 20 cm of the car are considered passed.
    # The first A* constraint therefore stays ahead instead of making the path chase points
    # immediately around the vehicle. The full ordered lap is still sent in one request.
    route_point_pass_distance: 0.20

    # Planning and control run in separate callback groups and executor threads.
    planner_action: /compute_path_through_poses
    planner_id: GridBased
    global_costmap_topic: /global_costmap/costmap_raw
    cmd_vel_topic: /cmd_vel
    planning_frequency: 5.0
    control_frequency: 50.0
    # A full-lap request contains about 230 short A* legs. PID keeps following the last
    # accepted path while this asynchronous request is running.
    planning_request_timeout: 2.00

    # Fallback settings used only with constraint_mode:=rolling_window.
    # Offsets are zero-based relative to the window anchor:
    # 2..14 sampled every 2 -> human route points 3,5,7,9,11,13,15.
    # Reaching anchor+9 (point 10) within 0.30 m advances the anchor by 10 points,
    # producing points 13,15,...,25 in the next window.
    window_start_offset: 2
    window_end_offset: 14
    window_sample_step: 2
    window_update_offset: 9
    window_advance: 10
    window_update_distance: 0.30

    # Remove hard route constraints only in the high-cost part of an inflated obstacle.
    # With inflation_radius=0.35, treating every nonzero cost as blocked would incorrectly
    # remove the static route at the map's narrowest 0.437 m-clearance section.
    constraint_blocked_cost_threshold: 160
    # Leave more route unconstrained after an obstacle so the fitted path can rejoin gradually.
    obstacle_away: 0.30
    obstacle_exit_points: 3

    # Keep NavFn's first valid left/right bypass choice while the route window is blocked.
    # An opposite-side candidate is accepted only when the active path is blocked nearby.
    avoidance_side_threshold: 0.08
    avoidance_side_lock_duration: 2.0
    # If the currently tracked side is blocked within this distance, accept an opposite-side
    # solution early instead of holding the old side until the obstacle is close.
    avoidance_side_override_distance: 1.20

    # Safe default: the complete perception/planning chain runs, but no command is published.
    # Set with launch argument enable_motion:=true only after inspecting the paths in RViz.
    enable_motion: false

    # Candidate-path smoothing and validation.
    path_resample_spacing: 0.05
    # Fit NavFn grid zigzags while allowing each route anchor to move by at most 4 cm.
    smoothing_passes: 40
    smoothing_weight: 0.20
    smoothing_data_weight: 0.05
    smoothing_anchor_max_shift: 0.04
    # Disambiguate the route's overlapping outbound/return corridor using vehicle heading.
    projection_heading_weight: 0.05
    footprint_front: 0.15
    footprint_rear: 0.15
    footprint_half_width: 0.095
    footprint_sample_step: 0.04
    # Reject both lethal (254) and inscribed (253) footprint costs after fitting.
    blocked_cost_threshold: 253
    max_path_age: 1.20
    hard_path_timeout: 3.0
    # Bridge brief TF dropouts without issuing a zero command on a single missed transform.
    max_pose_cache_age: 0.30

    # Real-car calibration:
    # linear.x=0.20 and angular.z=0.45 gave a center radius of about 0.30 m.
    # Increasing linear.x while holding angular.z made the radius larger, so use:
    # angular.z = yaw_command_scale * linear.x * path_curvature.
    yaw_command_scale: 0.675
    max_angular_command: 0.45
    angular_feedforward_margin: 1.00

    # Conservative first closed-loop limits.
    max_speed: 0.40
    min_tracking_speed: 0.20
    stale_path_speed: 0.20
    max_accel: 0.45
    max_decel: 0.90
    max_lateral_accel: 0.45
    # Reach the calibrated steering limit faster without exceeding angular.z=0.45.
    max_angular_rate: 3.00
    lookahead_distance: 0.35

    # Feed-forward curvature plus lateral/heading feedback.
    lateral_kp: 1.00
    lateral_ki: 0.00
    lateral_kd: 0.08
    heading_kp: 1.50
    integral_limit: 0.25

    # Continue replanning as obstacles approach; stop only inside the final safety envelope.
    slow_collision_distance: 0.80
    emergency_stop_distance: 0.32
